<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TurtleBot 3D MQTT Dashboard</title>
  <link rel="stylesheet" href="./styles.css">
  <script async src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main class="shell">
    <section class="scene-wrap">
      <canvas id="scene"></canvas>
      <div class="hud top-left">
        <strong>MQTT 3D 관제</strong>
        <span id="connectionLabel">simulation</span>
      </div>
      <div class="hud bottom-left">
        <span>클릭 좌표</span>
        <strong id="cursorLabel">x 0.00 / y 0.00</strong>
      </div>
    </section>

    <aside class="panel">
      <header>
        <h1>TurtleBot Fleet</h1>
        <p>ROS pose를 MQTT로 받아 3D 좌표에 표시합니다.</p>
      </header>

      <section class="controls">
        <label>
          Broker WebSocket
          <input id="brokerUrl" value="ws://10.10.16.201:9001/mqtt" spellcheck="false">
        </label>
        <label>
          Subscribe Topic
          <input id="topicFilter" value="turtlebot/+/telemetry/pose" spellcheck="false">
        </label>
        <div class="button-row">
          <button id="connectBtn" type="button">Connect</button>
          <button id="simBtn" type="button">Simulation</button>
        </div>
      </section>

      <section>
        <h2>Robots</h2>
        <div id="robotList" class="robot-list"></div>
      </section>

      <section>
        <h2>Send Goal</h2>
        <label>
          Target Robot
          <select id="goalRobot">
            <option value="bot17">bot17</option>
            <option value="bot18">bot18</option>
          </select>
        </label>
        <div class="goal-grid">
          <label>X<input id="goalX" type="number" step="0.1" value="0"></label>
          <label>Y<input id="goalY" type="number" step="0.1" value="0"></label>
          <label>Yaw<input id="goalTheta" type="number" step="0.1" value="0"></label>
        </div>
        <button id="sendGoalBtn" type="button">Publish Goal</button>
      </section>

      <section class="log-wrap">
        <h2>Events</h2>
        <pre id="log"></pre>
      </section>
    </aside>
  </main>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
